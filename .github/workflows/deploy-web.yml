# ---------------------------------------------------------------------------
# Deploy Web - build the SPA and publish it to S3 + CloudFront.
#
# Required GitHub secrets:
#   AWS_DEPLOY_ROLE_ARN          IAM role assumed via OIDC (terraform output github_deploy_role_arn)
#
# Required GitHub variables (terraform output github_variables):
#   WEB_BUCKET_NAME              S3 bucket that holds the built SPA
#   CLOUDFRONT_DISTRIBUTION_ID   distribution to invalidate after upload
#
# Optional GitHub variables:
#   AWS_REGION                   default eu-west-2
#   VITE_API_BASE_URL            default "/api" (same-origin via CloudFront). Set a full URL only
#                                if the API is served from a different hostname.
#   VITE_APP_NAME                default "Meeting Review"
#   VITE_COLLEGE_NAME            default "South London College"
# ---------------------------------------------------------------------------
name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write # OIDC token for AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  WEB_BUCKET_NAME: ${{ vars.WEB_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
  VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Meeting Review' }}
  VITE_COLLEGE_NAME: ${{ vars.VITE_COLLEGE_NAME || 'South London College' }}

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check configuration
        run: |
          missing=0
          for v in WEB_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set"; missing=1; fi
          done
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then echo "::error::Secret AWS_DEPLOY_ROLE_ARN is not set"; missing=1; fi
          exit $missing

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app (and its workspace dependencies)
        run: pnpm --filter "@slc/web..." build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-deploy-web-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed assets (long cache)
        # Vite writes content-hashed files under dist/assets - safe to cache for a year.
        run: |
          aws s3 sync apps/web/dist/assets "s3://$WEB_BUCKET_NAME/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload other static files (short cache)
        # favicons, manifest, robots.txt etc. Excludes the hashed assets (already uploaded)
        # and index.html (uploaded last so it never references assets that are not there yet).
        run: |
          aws s3 sync apps/web/dist "s3://$WEB_BUCKET_NAME" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=3600"

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp apps/web/dist/index.html "s3://$WEB_BUCKET_NAME/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $invalidation_id created - waiting for completion"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Summary
        run: |
          {
            echo "### Web deployed"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Bucket: \`$WEB_BUCKET_NAME\`"
            echo "- API base URL baked in: \`$VITE_API_BASE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"
